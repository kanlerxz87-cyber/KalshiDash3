name: Collect Kalshi demo data

# Public, credential-free collection into data/live/. The site renders that
# snapshot, so every number on the page has a fetch time and a query URL.
# Sources: https://docs.kalshi.com/getting_started/quick_start_market_data
#          https://docs.kalshi.com/api-reference/market/get-markets
on:
  workflow_dispatch:
  schedule:
    # Why two crons and why the minutes are not zero, from the official docs
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule):
    #   - "The schedule event can be delayed during periods of high loads ... High load times
    #      include the start of every hour ... some queued jobs may be dropped. To decrease the
    #      chance of delay, schedule your workflow to run at a different time of the hour."
    #   - "The shortest interval you can run scheduled workflows is once every 5 minutes."
    # Measured on this repository on 2026-11-21 (gh run list --workflow=collect.yml): a */20 cron
    # produced 2 scheduled runs in ~10 hours while 21 manual dispatches ran normally, i.e. the
    # snapshot layer aged past its own 45-minute staleness banner most of the day. Two off-peak
    # crons plus the chained dispatch below (a documented GITHUB_TOKEN exception, see the last
    # step) keep fresh public data on the page without inventing a cadence the platform offers.
    - cron: "7,27,47 * * * *"
    - cron: "13,43 * * * *"

permissions:
  contents: write
  actions: write   # needed only for the chained dispatch in the last step (workflow_dispatch of collect.yml)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the official demo REST root
        run: |
          set -euo pipefail
          code=$(curl -sS -m 30 -o /tmp/status.json -w '%{http_code}' \
            https://external-api.demo.kalshi.co/trade-api/v2/exchange/status)
          echo "HTTP $code"; head -c 400 /tmp/status.json || true
          test "$code" = "200"
      - name: Collect
        run: python3 scripts/collect.py --orderbooks 4
      - name: Build live alert feed (>= $0.10 swings)
        run: python3 scripts/build_alerts.py
      - name: Build swing leads from the review ledger (fetched sources only; refuses causal wording)
        run: python3 scripts/catalysts.py
      - name: Paper-trade fixed strategies on the alert archive (no orders, no account)
        run: python3 scripts/simulate.py
      - name: Validate the snapshot, the alert archive/feeds, and the simulation
        run: |
          set -uo pipefail
          status=0
          annotate() {  # surface validator diagnostics as check annotations, readable via `gh run view`
            printf '%s\n' "$1" | head -12 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            done
          }
          run_v() {
            name="$1"; shift
            if out=$("$@" 2>&1); then
              printf '%s\n' "$out"
            else
              status=1
              printf '::error::%s FAILED\n' "$name"
              annotate "$out"
            fi
          }
          run_v validate_live   python3 scripts/tests/validate_live.py
          run_v validate_alerts python3 scripts/tests/validate_alerts.py
          run_v test_alerts     python3 scripts/tests/test_alerts.py
          run_v test_coverage   python3 scripts/tests/test_collect_coverage.py
          run_v test_settled    python3 scripts/tests/test_settled_selection.py
          run_v test_simulate   python3 scripts/tests/test_simulate.py
          run_v validate_catalysts python3 scripts/tests/validate_catalysts.py
          exit $status
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name  "kalshi-collector-bot"
          git config user.email "kalshi-collector-bot@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
      # Bounded freshness watchdog. This is NOT a chain: it dispatches only when the committed
      # snapshot is older than STALE_MIN minutes, at most once per MAX_PER_HOUR, and only if no
      # collect run is already in flight. Why the guards exist: the first version of this step
      # dispatched unconditionally, and on 2026-11-21 06:34-06:39Z it produced runs every
      # 1-2 minutes (44876177777 -> 44876253177 -> 44876330331 -> 44876426619 -> 44876553969),
      # each committing a new snapshot. That is a runaway loop, not a cadence, so the step was
      # disabled on the default branch and rewritten with all three limits before re-enabling.
      # Rationale for dispatch at all: pushes made with the repository's GITHUB_TOKEN do not start
      # workflows, but workflow_dispatch does ("workflow_dispatch and repository_dispatch events
      # always create workflow runs", https://docs.github.com/en/actions/concepts/security/github_token),
      # and GitHub documents that scheduled runs "can be delayed" and "some queued jobs may be
      # dropped" (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
      - name: "Freshness watchdog — stale-only, hourly cap, no overlap"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MIN: "35"
          MAX_PER_HOUR: "3"
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then echo "gh unavailable; the cron schedules remain the only trigger"; exit 0; fi
          now=$(date -u +%s)
          collected=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/live/markets.json")
          try:
              print(json.loads(p.read_text()).get("collected_at", ""))
          except Exception:
              print("")
          PY
          )
          if [ -z "$collected" ]; then echo "no snapshot timestamp; not dispatching"; exit 0; fi
          age_min=$(( (now - $(date -u -d "$collected" +%s)) / 60 ))
          echo "snapshot $collected is ${age_min}m old (threshold ${STALE_MIN}m)"
          in_flight=$(gh run list --workflow=collect.yml --limit 10 --json status,event             -q '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          recent=$(gh run list --workflow=collect.yml --limit 40 --json createdAt,event             -q "[.[] | select(.event == \"workflow_dispatch\") | .createdAt | fromdateiso8601 | select(. > $now - 3600)] | length")
          echo "in flight: ${in_flight}; dispatches in the last hour: ${recent} (cap ${MAX_PER_HOUR})"
          if [ "$in_flight" -gt 0 ]; then echo "a collection is already running; not dispatching"; exit 0; fi
          if [ "$age_min" -lt "$STALE_MIN" ]; then echo "snapshot is fresh; not dispatching"; exit 0; fi
          if [ "$recent" -ge "$MAX_PER_HOUR" ]; then echo "hourly dispatch cap reached; waiting for the cron"; exit 0; fi
          gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" --event workflow_dispatch \
            && echo "snapshot was stale: queued one collection" \
            || echo "::warning::dispatch failed; the cron schedules remain the trigger"
