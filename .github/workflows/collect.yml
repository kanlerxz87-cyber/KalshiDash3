name: Collect Kalshi demo data

# Public, credential-free collection into data/live/. The site renders that
# snapshot, so every number on the page has a fetch time and a query URL.
# Sources: https://docs.kalshi.com/getting_started/quick_start_market_data
#          https://docs.kalshi.com/api-reference/market/get-markets
#
# Cadence (T55, arena-b25b0914 — measurements in COORDINATION.md):
#   GitHub delivered 2 of ~67 configured schedule events for this workflow between 06:49Z and
#   20:17Z on 2026-11-21, and the old "freshness watchdog" step could never fire (it ran right
#   after a commit, when the snapshot was ~0 minutes old). So the cadence no longer depends on the
#   scheduler: on main, one run is a bounded RELAY — scripts/collect_relay.py repeats the pass
#   (probe -> collect -> alerts -> catalysts -> simulation -> validators -> commit) on a fixed
#   15-minute grid for at most 5.5 hours and queues exactly one successor right before its final
#   pass (the concurrency group holds it until this run ends, even by timeout). Every bound (default
#   branch only, >= 2 h of work before a successor, never while another run is queued,
#   COLLECT_RELAY=off kill switch, <= 6 pushes/hour) is enforced in that script and pinned by
#   scripts/tests/test_collect_relay.py. On any other branch a run is a single pass, as before.
#   The per-pass validator list lives in scripts/collect_relay.py (VALIDATORS).
#   Stop a running relay: set COLLECT_RELAY=off, then `gh run cancel <run id>`.
on:
  workflow_dispatch:
    inputs:
      relay_minutes:
        description: "Keep collecting for this many minutes (blank = 330 on main, a single pass elsewhere; max 330)"
        required: false
        default: ""
      interval_minutes:
        description: "Minutes between passes inside one run (blank = 15; min 10, or 2 for a dry run)"
        required: false
        default: ""
      commit:
        description: "Commit and push snapshots (false = dry run: validate only, dispatch nothing)"
        required: false
        default: "true"
  schedule:
    # Why two crons and why the minutes are not zero, from the official docs
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule):
    #   - "The schedule event can be delayed during periods of high loads ... High load times
    #      include the start of every hour ... some queued jobs may be dropped. To decrease the
    #      chance of delay, schedule your workflow to run at a different time of the hour."
    #   - "The shortest interval you can run scheduled workflows is once every 5 minutes."
    # Measured on this repository on 2026-11-21 (gh run list --workflow=collect.yml): a */20 cron
    # produced 2 scheduled runs in ~10 hours while 21 manual dispatches ran normally, i.e. the
    # snapshot layer aged past its own 45-minute staleness banner most of the day. Two off-peak
    # crons plus the chained dispatch below (a documented GITHUB_TOKEN exception, see the last
    # step) keep fresh public data on the page without inventing a cadence the platform offers.
    # [T55, arena-b25b0914: the chained dispatch is now the relay successor queued by
    #  scripts/collect_relay.py; on main these crons are the RESTART path if a relay ever stops.]
    - cron: "7,27,47 * * * *"
    - cron: "13,43 * * * *"

permissions:
  contents: write
  actions: write   # scripts/collect_relay.py: one collect.yml successor per relay; desk.yml when roi.json is stale

# Per branch: a relay on main never blocks a single pass dispatched on a session branch (and the
# other way round). GitHub runs at most one run per group and keeps at most one pending.
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # relay budget 330 min + one final pass; the job limit is 6 h
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # each pass resets to the branch's newest remote head and may rebase a push
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect, derive, validate, commit (relay on main, one pass elsewhere)
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_MINUTES: ${{ github.event.inputs.relay_minutes }}
          INTERVAL_MINUTES: ${{ github.event.inputs.interval_minutes }}
          COMMIT: ${{ github.event.inputs.commit }}
          COLLECT_RELAY: ${{ vars.COLLECT_RELAY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -u scripts/collect_relay.py
      # ---------------------------------------------------------------------------------
      # F-67 (measured 2026-11-21, this session): a workflow cannot sustain its own cadence.
      #
      # The previous step here was a "bounded freshness watchdog" that dispatched collect.yml
      # when the snapshot was more than 35 minutes old. It cannot work, for a reason that is
      # visible in the data rather than in an opinion:
      #   * the snapshot commit is made with the repository's GITHUB_TOKEN, and the GitHub docs
      #     state that such a push does not start a run — so it does not trigger this workflow
      #     at all, and the workflow cannot dispatch from inside a run that never happens;
      #   * a dispatched run started from inside a run only fires while runs keep happening,
      #     i.e. while the cron is delivering; the moment the cron stalls, so does the rescue.
      # Observed schedule deliveries on main (Actions API, gh run list --workflow=collect.yml,
      # event == schedule): 2026-11-20T19:14:35Z, 2026-11-21T00:49:31Z, 15:15:48Z, 15:20:32Z.
      # Four deliveries in ~20 hours against a declared cadence of 12/hour. The 15:15/15:20 pair
      # is the back-to-back conflation the GitHub docs warn about.
      # So the step is now a REPORT, not a rescue: it prints the measured delivery gaps so the
      # number is in the run log and on the record, and it changes nothing. A monitor now lives
      # in .github/workflows/freshness-alarm.yml, which runs on its own cron and can therefore
      # still act when collect.yml's cron stalls (it is subject to the same platform behaviour,
      # which is disclosed there).
      # [T55, arena-b25b0914, merged 2026-11-21: the step above now sustains the cadence from inside one
      #  long run on main and queues its own successor with workflow_dispatch, which the GITHUB_TOKEN
      #  docs exempt (https://docs.github.com/en/actions/concepts/security/github_token). This report
      #  is kept unchanged as the measured record. test_scope.py still runs BEFORE collecting, in every
      #  pass (PRECHECKS in scripts/collect_relay.py), as be07a04 intended.]
      - name: "Cadence report — measured schedule deliveries, no self-dispatch"
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh unavailable; no cadence measurement in this run"
            exit 0
          fi
          echo "Measured collect.yml schedule deliveries (newest first):"
          gh run list --workflow=collect.yml --limit 40 --json createdAt,event \
            --jq '[.[] | select(.event == "schedule") | .createdAt] | .[:8] | .[]' || true
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/live/markets.json")
          try:
              doc = json.loads(p.read_text())
              print("snapshot collected_at:", doc.get("collected_at"), "| open rows:", len(doc.get("open_markets") or []))
          except Exception as e:
              print("snapshot unreadable:", e)
          PY
          echo "Why there is no self-dispatch here: F-67, recorded on flagged.html."
