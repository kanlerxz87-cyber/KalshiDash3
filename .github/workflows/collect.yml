name: Collect Kalshi demo data

# Public, credential-free collection into data/live/. The site renders that
# snapshot, so every number on the page has a fetch time and a query URL.
# Sources: https://docs.kalshi.com/getting_started/quick_start_market_data
#          https://docs.kalshi.com/api-reference/market/get-markets
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the official demo REST root
        run: |
          set -euo pipefail
          code=$(curl -sS -m 30 -o /tmp/status.json -w '%{http_code}' \
            https://external-api.demo.kalshi.co/trade-api/v2/exchange/status)
          echo "HTTP $code"; head -c 400 /tmp/status.json || true
          test "$code" = "200"
      - name: Collect
        run: python3 scripts/collect.py --orderbooks 4
      - name: Build live alert feed (>= $0.10 swings)
        run: python3 scripts/build_alerts.py
      - name: Paper-trade fixed strategies on the alert archive (no orders, no account)
        run: python3 scripts/simulate.py
      - name: Validate the snapshot, the alert archive/feeds, and the simulation
        run: |
          set -uo pipefail
          rc=0
          : > data/live/collect_log.txt
          for t in validate_live validate_alerts test_alerts test_simulate; do
            echo "=== scripts/tests/$t.py ===" >> data/live/collect_log.txt
            python3 "scripts/tests/$t.py" >> data/live/collect_log.txt 2>&1 || rc=$?
          done
          cat data/live/collect_log.txt
          exit "$rc"
      - name: Run alert-feed tests
        run: python3 scripts/tests/test_alerts.py
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name  "kalshi-collector-bot"
          git config user.email "kalshi-collector-bot@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
      - name: Commit the collection log (runs even when validation failed)
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "kalshi-collector-bot"
          git config user.email "kalshi-collector-bot@users.noreply.github.com"
          if [ ! -f data/live/collect_log.txt ]; then
            echo "the collection did not reach the validation step" > data/live/collect_log.txt
          fi
          git add data/live/collect_log.txt
          if git diff --cached --quiet; then echo "no log change"; exit 0; fi
          git commit -m "chore: collector log $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
