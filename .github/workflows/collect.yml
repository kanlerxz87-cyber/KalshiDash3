name: Collect Kalshi demo data

# Public, credential-free collection into data/live/. The site renders that
# snapshot, so every number on the page has a fetch time and a query URL.
# Sources: https://docs.kalshi.com/getting_started/quick_start_market_data
#          https://docs.kalshi.com/api-reference/market/get-markets
#
# Cadence (T55, arena-b25b0914 — measurements in COORDINATION.md):
#   GitHub delivered 2 of ~67 configured schedule events for this workflow between 06:49Z and
#   20:17Z on 2026-11-21, and the old "freshness watchdog" step could never fire (it ran right
#   after a commit, when the snapshot was ~0 minutes old). So the cadence no longer depends on the
#   scheduler: on main, one run is a bounded RELAY — scripts/collect_relay.py repeats the pass
#   (probe -> collect -> alerts -> catalysts -> simulation -> validators -> commit) every 15 minutes
#   for at most 5.5 hours, then dispatches exactly one successor. Every bound (default branch only,
#   >= 2 h of work before a successor, never while another run is queued, COLLECT_RELAY=off kill
#   switch, <= 6 pushes/hour) is enforced in that script and pinned by
#   scripts/tests/test_collect_relay.py. On any other branch a run is a single pass, as before.
#   The per-pass validator list lives in scripts/collect_relay.py (VALIDATORS).
on:
  workflow_dispatch:
    inputs:
      relay_minutes:
        description: "Keep collecting for this many minutes (blank = 330 on main, a single pass elsewhere; max 330)"
        required: false
        default: ""
      interval_minutes:
        description: "Minutes between passes inside one run (blank = 15; min 10, or 2 for a dry run)"
        required: false
        default: ""
      commit:
        description: "Commit and push snapshots (false = dry run: validate only, dispatch nothing)"
        required: false
        default: "true"
  schedule:
    # Restart path only: if a relay ever stops (runner lost, kill switch lifted), the next schedule
    # event that GitHub does deliver starts a new one. Off the top of the hour on purpose: "High load
    # times include the start of every hour"
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
    - cron: "7,27,47 * * * *"
    - cron: "13,43 * * * *"

permissions:
  contents: write
  actions: write   # scripts/collect_relay.py: one collect.yml successor per relay; desk.yml when roi.json is stale

# Per branch: a relay on main never blocks a single pass dispatched on a session branch (and the
# other way round). GitHub runs at most one run per group and keeps at most one pending.
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # relay budget 330 min + one final pass; the job limit is 6 h
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # each pass resets to the branch's newest remote head and may rebase a push
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect, derive, validate, commit (relay on main, one pass elsewhere)
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_MINUTES: ${{ github.event.inputs.relay_minutes }}
          INTERVAL_MINUTES: ${{ github.event.inputs.interval_minutes }}
          COMMIT: ${{ github.event.inputs.commit }}
          COLLECT_RELAY: ${{ vars.COLLECT_RELAY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -u scripts/collect_relay.py
