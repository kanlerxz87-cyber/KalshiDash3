name: Deploy site to GitHub Pages

# Single publishing mechanism. GitHub Pages is configured to build from
# GitHub Actions (not from a branch), so docs/ is the only thing that can ever
# be published and the deployed content cannot silently change source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the committed snapshot
        run: python3 scripts/tests/validate_live.py

      - name: Run alert-feed tests
        run: python3 scripts/tests/test_alerts.py

      - name: Check links, HTML and data files (fails the build on a broken page)
        run: python3 scripts/check_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
