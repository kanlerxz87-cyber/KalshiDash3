name: Deploy site to GitHub Pages

# Canonical published tree is the repository root. Configure Pages to use
# GitHub Actions so legacy branch publishing cannot bypass these release gates.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Verified 2026-11-21: a push made with the repository's GITHUB_TOKEN does not trigger a Pages
  # build. GitHub states it verbatim: "Commits pushed by a GitHub Actions workflow that uses the
  # GITHUB_TOKEN do not trigger a GitHub Pages build."
  #   https://docs.github.com/en/actions/concepts/security/github_token
  # The scheduled collector (collect.yml) commits data/live with exactly that token, so a push
  # alone would not deploy a snapshot. Corrected reading (R-B6, measured 2026-11-21): this
  # repository's Pages builds API shows legacy builds pushed by github-actions[bot] (e.g. 276d356
  # at 15:21:26Z, c43667f at 20:27:28Z, a96b7de at 20:58:46Z), so an earlier comment here that
  # claimed every collector snapshot was "NEVER deployed" was too strong. The 5-hour staleness on
  # 2026-11-21 was the absence of collector runs (flagged F-40), not undeployed commits. Both
  # mechanisms below are kept: the workflow_run chain, and the per-pass pages.yml dispatch the
  # relay makes, so each committed pass publishes through this gate (flagged F-68 records the
  # docs-vs-observed discrepancy).
  # workflow_run is the documented way to chain on a completed run regardless of the token that
  # pushed: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
  # The deploy gate below is unchanged: only refs/heads/main and only non-PR runs may deploy, so
  # a completed collect run on main re-publishes, and one on any other branch does nothing.
  workflow_run:
    workflows: ["Collect Kalshi demo data", "Live desk scan (ROI screen + swing alerts)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  # A workflow_run deploy must not cancel a publish already in flight; the newest artifact wins
  # on the next run because release deploys are serialised by this group.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only DOM dependency
        run: npm install --no-save --package-lock=false jsdom@26
      - name: Run the scope tests (five topics only; no demo QA fixtures as headlines)
        run: python3 scripts/tests/test_scope.py
      - name: Verify release (offline, no account or orders)
        run: python3 scripts/verify_release.py
      - name: Stage only public site files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        with:
          path: _site

  deploy:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
