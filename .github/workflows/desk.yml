name: Live desk scan (ROI screen + swing alerts)

# Writes data/live/roi.json — the ROI picks, the >=10c swing list and the out-of-sample
# hit-rate measurement that live.html and roi.html render. Credential-free: only public
# demo endpoints are called, so no secret is needed and nothing can be executed against
# an account by this workflow.
#
# Deliberately separate from collect.yml (owned by another task): collect.yml commits the
# market snapshot + price history, this one commits only data/live/roi.json, and it is the
# only writer of that file. Both run on a schedule, so the page always has a recent
# fallback even when a browser cannot reach the API itself.
on:
  workflow_dispatch:
    inputs:
      validate:
        description: "how many settled markets to replay out-of-sample (0 disables)"
        required: false
        default: "24"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  actions: write   # only for the bounded freshness step at the bottom (dispatch collect.yml)

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Why bounded (arena-eed90ce4, F-85): this job shares the single-run `desk` concurrency group with
    # cancel-in-progress:false, so a job that never returns would hold every later desk scan pending for
    # GitHub's 6-hour default job limit and data/live/roi.json would silently stop refreshing. A measured
    # scan takes ~4.5 min (run 44997539037) and the slowest observed was 12m19s (44994167105), so 25
    # minutes leaves room for a slow demo API without ever pinning the group.
    # See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Model tests (fee table, browser/CI parity, engine behaviour)
        run: |
          python3 scripts/tests/test_fees.py
          python3 scripts/tests/test_roi_parity.py
          node scripts/tests/test_engine_node.js
          python3 scripts/tests/test_roi_scan_offline.py
          # The scan itself, over the real committed snapshot with the network stubbed: this is
          # the run that would have caught the ZeroDivisionError that kept roi.json from ever
          # being written (127 of 387 open demo markets carry a $0.00 ask).
          python3 scripts/tests/test_roi_scan_snapshot.py

      - name: Page render smoke test (jsdom, no network)
        run: |
          set -euo pipefail
          if npm install --no-save --silent --no-audit --no-fund jsdom >/dev/null 2>&1; then
            node scripts/tests/test_pages_dom.js
          else
            echo "::warning::jsdom could not be installed on this runner; the DOM render test was skipped."
            node scripts/tests/test_engine_node.js   # still exercises the engine without a DOM
          fi

      - name: Probe the official demo REST root
        run: |
          set -euo pipefail
          code=$(curl -sS -m 30 -o /tmp/status.json -w '%{http_code}' \
            https://external-api.demo.kalshi.co/trade-api/v2/exchange/status)
          echo "HTTP $code"; head -c 300 /tmp/status.json || true
          test "$code" = "200"

      - name: Scan the demo API
        env:
          VALIDATE: ${{ github.event.inputs.validate }}
        run: |
          set -uo pipefail
          n="${VALIDATE:-24}"
          case "$n" in ''|*[!0-9]*) n=24 ;; esac
          if out=$(python3 scripts/roi_scan.py --validate "$n" --out data/live/roi.json 2>&1); then
            printf '%s\n' "$out"
          else
            printf '%s\n' "$out" | head -12 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            done
            exit 1
          fi

      - name: Refuse to commit an unsourced or inconsistent scan
        run: |
          set -uo pipefail
          if out=$(python3 scripts/tests/validate_roi.py 2>&1); then
            printf '%s\n' "$out"
          else
            printf '%s\n' "$out" | head -12 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            done
            exit 1
          fi

      - name: Commit the scan
        run: |
          set -euo pipefail
          git config user.name  "kalshi-desk-bot"
          git config user.email "kalshi-desk-bot@users.noreply.github.com"
          git add data/live/roi.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: live-desk scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ---------------------------------------------------------------------------------
      # Bounded freshness watchdog — the fix for a STUCK collector, not a slow one.
      #
      # collect.yml has its own freshness step, but that step only runs inside a collection.
      # Measured on 2026-11-21 with `gh run list --workflow=collect.yml`: scheduled collect
      # runs at 00:49Z, 06:0xZ, 15:15:48Z and 15:20:32Z, then nothing until a manual
      # dispatch at 20:26Z — about five hours with a 20-minute cron. GitHub documents that
      # scheduled runs may be delayed and that "some queued jobs may be dropped"
      # (https://docs.github.com/en/actions/reference/workflows-and-events/events-that-trigger-workflows),
      # so when the scheduler drops collect runs there is nothing left to revive them.
      # This step runs in a DIFFERENT workflow with its own cron, so it survives that.
      #
      # All three limits are enforced by scripts/watchdog.py, which is unit-tested offline
      # (scripts/tests/test_watchdog.py) precisely because an earlier version of this idea
      # shipped without them and chained five collect runs in five minutes (F-63).
      # ---------------------------------------------------------------------------------
      - name: "Freshness watchdog — dispatch ONE collection if the snapshot is stale"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MIN: "35"      # minutes; see scripts/watchdog.py for why 35
          MAX_PER_HOUR: "3"    # hard cap on collector dispatches from this step
        run: |
          set -uo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh unavailable in this runner; the cron schedules remain the only trigger"
            exit 0
          fi
          collected=$(python3 - <<'PY'
          import json, pathlib
          try:
              print(json.loads(pathlib.Path("data/live/markets.json").read_text()).get("collected_at", ""))
          except Exception:
              print("")
          PY
          )
          in_flight=$(gh run list --workflow=collect.yml --limit 20 --json status \
            -q '[.[] | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null || echo 0)
          now=$(date -u +%s)
          recent=$(gh run list --workflow=collect.yml --limit 60 --json createdAt,event \
            -q "[.[] | select(.event == \"workflow_dispatch\") | .createdAt | fromdateiso8601 | select(. > $now - 3600)] | length" 2>/dev/null || echo 0)
          echo "snapshot collected_at=${collected:-<none>} in_flight=${in_flight} dispatches_last_hour=${recent}"
          decision=$(python3 scripts/watchdog.py --collected-at "$collected" \
            --in-flight "${in_flight:-0}" --dispatches-last-hour "${recent:-0}" \
            --stale-min "${STALE_MIN:-35}" --max-per-hour "${MAX_PER_HOUR:-3}")
          echo "watchdog: $decision"
          case "$decision" in
            dispatch)
              gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" \
                && echo "queued exactly one collection" \
                || echo "::warning::dispatch failed; the cron schedules remain the trigger"
              ;;
            *)
              echo "not dispatching: ${decision#skip: }"
              ;;
          esac
